[package]
name = "gobob-tokenlist"
# Keep in sync with "version" in tokenlist.json (checked by tests/parity.rs).
version = "1.0.0"
edition = "2024"
rust-version = "1.88"
description = "BOB token list data and utilities"
license = "MIT"
repository = "https://github.com/bob-collective/tokenlist"
readme = "README.md"
# Distributed as a git dependency, not via crates.io.
publish = false

[features]
serde = ["dep:serde"]

# Requirements are kept loose so the crate reuses the versions already in a
# consumer's Cargo.lock instead of pulling in new ones.
[dependencies]
bs58 = "0.5"
serde = { version = "1", optional = true }
sha2 = "0.11"
sha3 = ">=0.11, <0.13"

# build.rs generates the token tables from data/ and supported-chains.json; it
# shares src/address.rs (bs58, sha2, sha3) to checksum addresses. No features
# here: build-dependency features are unified with every proc macro and build
# script in a consumer's graph.
[build-dependencies]
bs58 = "0.5"
serde = "1"
serde_json = "1"
sha2 = "0.11"
sha3 = ">=0.11, <0.13"

[dev-dependencies]
serde_json = "1"

name: Publish tokenlist assets

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: publish-tokenlist-assets
  cancel-in-progress: false

jobs:
  publish:
    name: Publish assets and notify UI
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.10.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and verify tokenlist
        run: pnpm build

      - name: Publish and verify assets
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: pnpm publish:assets

      - name: Notify UI
        env:
          GH_TOKEN: ${{ secrets.UI_DISPATCH_TOKEN }}
          TOKENLIST_SHA: ${{ github.sha }}
        run: |
          gh api repos/bob-collective/ui/dispatches \
            -f event_type=tokenlist-merged \
            -f client_payload[sha]="$TOKENLIST_SHA"

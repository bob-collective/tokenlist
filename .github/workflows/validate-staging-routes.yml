name: Validate staging routes

on:
  # Sent by the internal deployments repo after a staging deploy is merged.
  # It carries no payload; the event itself is the signal.
  repository_dispatch:
    types: [staging-updated]
  workflow_dispatch:
    inputs:
      delay_seconds:
        description: Seconds to wait before checking (0-600)
        required: false
        default: '120'
        type: string
      dry_run:
        description: Print the issue instead of creating it
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: validate-staging-routes
  cancel-in-progress: false

jobs:
  check:
    name: Validate staging routes
    runs-on: bob-ubuntu-latest
    # Covers the longest manual delay (600s) plus setup and the check itself.
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.24.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Gives the staging rollout time to land. repository_dispatch has no
      # inputs, so it always waits 120 seconds.
      - name: Wait for staging rollout
        env:
          DELAY_SECONDS: ${{ inputs.delay_seconds || '120' }}
        run: |
          if ! [[ "$DELAY_SECONDS" =~ ^(0|[1-9][0-9]{0,2})$ ]] || (( DELAY_SECONDS > 600 )); then
            echo "::error::delay_seconds must be an integer from 0 to 600"
            exit 1
          fi
          sleep "$DELAY_SECONDS"

      - name: Validate staging routes against tokenlist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_ROLE_ID: ${{ vars.DISCORD_ROLE_ID }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN_INPUT" = "true" ]; then
            pnpm validate:staging-routes --dry-run
          else
            pnpm validate:staging-routes
          fi
